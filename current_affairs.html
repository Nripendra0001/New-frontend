<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Current Affairs - SarkariNext</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/updates.css">
    <link rel="icon" type="image/png" href="./favicon.png" />
</head>
<body class="updates-body">

    <header class="up-header">
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Main Home
        </a>
        <h1>Daily Current Affairs</h1>
    </header>

    <div class="up-container">
        <div class="breadcrumb">
            <a href="index.html">Home</a> > <span>Current Affairs</span>
        </div>
        
        <h1 class="sn-section-heading">
            Daily Current <span class="sn-heading-accent">Affairs</span>
            <div class="sn-heading-underline"></div>
        </h1>

        <div style="margin-bottom: 24px; font-weight: 600; color: #ff9900;" id="currentDateBadge">Loading Date...</div>

        <div class="category-filters" id="jobFilters" style="display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;">
            <button class="smart-filter-btn active" data-filter="all" style="background: #0f172a; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">All Updates</button>
            <button class="smart-filter-btn" data-filter="for-me" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">🎯 Recommended For Me</button>
            <button class="smart-filter-btn" data-filter="new" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">✨ Just Added</button>
            <button class="smart-filter-btn" data-filter="closing-soon" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">📅 New Today</button>
            <button class="smart-filter-btn" data-filter="my-state" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">📍 My State Only</button>
        </div>
        
        <div id="jobList" class="sn-premium-grid">
            <!-- Rendered via current_affairs.js -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/preferences.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/cardComponent.js"></script>
    <script src="js/current_affairs.js"></script>
</body>
</html>
