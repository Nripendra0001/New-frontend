<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Jobs - Sarkari Updates</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/updates.css">
    <link rel="icon" type="image/png" href="./favicon.png" />
</head>
<body class="updates-body">

    <header class="up-header">
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Main Home
        </a>
        <h1>Latest Jobs</h1>
    </header>

    <div class="up-container">
        <div class="breadcrumb">
            <a href="index.html">Home</a> > <span>Latest Jobs</span>
        </div>
        
        <h1 class="sn-section-heading">
            Latest Government <span class="sn-heading-accent">Jobs</span>
            <div class="sn-heading-underline"></div>
        </h1>

        <div class="category-filters" id="jobFilters" style="display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;">
            <button class="filter-btn active" data-category="All" style="background: #0f172a; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">All</button>
            <button class="filter-btn" data-category="SSC" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">SSC</button>
            <button class="filter-btn" data-category="Railway" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">Railway</button>
            <button class="filter-btn" data-category="Banking" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">Banking</button>
            <button class="filter-btn" data-category="UPSC / State PSC" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">UPSC / State PSC</button>
            <button class="filter-btn" data-category="Defense / Police" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">Defense / Police</button>
            <button class="filter-btn" data-category="Teaching" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">Teaching</button>
            <button class="filter-btn" data-category="Other" style="background: #e2e8f0; color: #333; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;">Other</button>
        </div>
        
        <div id="jobList" class="sn-premium-grid">
            <!-- Rendered via job.js -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/preferences.js"></script><script src="js/engine.js"></script><script src="js/cardComponent.js"></script>
    <script src="js/job.js"></script>
</body>
</html>
